  const worldW = NAT_W * S;
  const worldH = NAT_H * S;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const PW = Math.round(worldW * dpr), PH = Math.round(worldH * dpr);

  // 월드 & 캔버스 크기 고정(팬/리사이즈해도 그림은 유지)
  world.style.width  = worldW + 'px';
  world.style.height = worldH + 'px';
  [cv1, cv2].forEach(c=>{
    c.style.width = worldW + 'px'; c.style.height = worldH + 'px';
    c.width  = PW; c.height = PH;
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  });
  ctx1.lineCap = ctx2.lineCap = 'round';
  ctx1.lineJoin = ctx2.lineJoin = 'round';
  ctx1.lineWidth = ctx2.lineWidth = R*2;
  ctx1.strokeStyle = paintColor1;
  ctx2.strokeStyle = paintColor2;

  /* ---- 글씨 마스크 래스터화 + 단계별 재노출 캔버스 ---- */
  const textMask  = document.createElement('canvas'); textMask.width  = PW; textMask.height  = PH;
  const revealCv1 = document.createElement('canvas'); revealCv1.width = PW; revealCv1.height = PH; // 전체 글자(흰색)
  const revealCv2 = document.createElement('canvas'); revealCv2.width = PW; revealCv2.height = PH; // 글자 ∩ 초록칠(검정)
  let maskReady = false, pending2 = false;
  (function(){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${NAT_W} ${NAT_H}" width="${PW}" height="${PH}"><g fill="#000">${srcInner}</g></svg>`;
    const img = new Image();
    img.onload = ()=>{
      textMask.getContext('2d').drawImage(img,0,0,PW,PH); maskReady=true;
      buildReveal(revealCv1, revealInk1, []);              // 1단계용: 전체 글자(흰색) — 시작부터 필요
      if(pending2){ buildReveal(revealCv2, revealInk2, [cv1]); pending2=false; }
    };
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  })();

  // 글자 ∩ (넘겨준 마스크들의 교집합)을 지정 색으로 만들어 둠
  function buildReveal(dest, color, masks){
    const r = dest.getContext('2d');
    r.setTransform(1,0,0,1,0,0);
    r.globalCompositeOperation = 'source-over'; r.globalAlpha = 1;
    r.clearRect(0,0,PW,PH);
    r.drawImage(textMask, 0, 0);                         // 글자 전체
    r.globalCompositeOperation = 'destination-in';
    for(const m of masks) r.drawImage(m, 0, 0);          // ∩ 각 마스크(칠한 영역)
    r.globalCompositeOperation = 'source-in';
    r.fillStyle = color; r.fillRect(0,0,PW,PH);          // 지정 색으로
    r.globalCompositeOperation = 'source-over';
  }

  // 팬 위치
  let tx = (innerWidth - worldW)/2;
  let ty = (innerHeight - worldH)/2;
  function clamp(){
    tx = worldW <= innerWidth  ? (innerWidth  - worldW)/2 : Math.min(0, Math.max(innerWidth  - worldW, tx));
    ty = worldH <= innerHeight ? (innerHeight - worldH)/2 : Math.min(0, Math.max(innerHeight - worldH, ty));
  }
  function applyPan(){ clamp(); world.style.transform = `translate(${tx}px,${ty}px)`; }
  applyPan();
  addEventListener('resize', applyPan);

  // stage 1 = 초록, stage 2 = 붉음
  let stage = 1;
  function overlayCtx(){ return stage === 1 ? ctx1 : ctx2; }
  function revealSrc(){ return stage === 1 ? revealCv1 : revealCv2; }

  // 새 색 선 1번 + clip 없이 source-atop 으로 보존 글자 재노출
  function seg(octx, src, x0,y0,x1,y1){
    octx.globalCompositeOperation = 'source-over';
    octx.beginPath(); octx.moveTo(x0,y0); octx.lineTo(x1,y1); octx.stroke();
    const minX=Math.min(x0,x1)-R, minY=Math.min(y0,y1)-R;
    const maxX=Math.max(x0,x1)+R, maxY=Math.max(y0,y1)+R;
    let sx=Math.max(0,minX*dpr), sy=Math.max(0,minY*dpr);
    let sw=Math.min(PW-sx,(maxX-minX)*dpr), sh=Math.min(PH-sy,(maxY-minY)*dpr);
    if(sw>0 && sh>0){
      octx.globalCompositeOperation = 'source-atop'; // 새 색이 있는 곳에만 글자를 얹음
      octx.drawImage(src, sx,sy,sw,sh, sx/dpr,sy/dpr,sw/dpr,sh/dpr);
      octx.globalCompositeOperation = 'source-over';
    }
  }

  // 다음 단계 : 1(초록: 글자 전체)→2(붉음: 글자 ∩ 초록칠)
  nextBtn.addEventListener('click', ()=>{
    if(stage !== 1) return;
    stage = 2;
    if(maskReady) buildReveal(revealCv2, revealInk2, [cv1]); else pending2 = true;
    nextBtn.disabled = true;
    last = null;
  });

  let panning=false, panStart=null, last=null;

  viewport.addEventListener('pointerdown', (e)=>{
    panning=true; document.body.classList.add('panning');
    panStart={cx:e.clientX, cy:e.clientY, tx, ty};
    last=null;
    viewport.setPointerCapture(e.pointerId);
  });

  addEventListener('pointermove', (e)=>{
    const x=e.clientX, y=e.clientY;
    cursor.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
    if(e.target.closest && e.target.closest('.ui')) return; // 버튼 위에선 칠 안 함
    if(panning){
      tx = panStart.tx + (x - panStart.cx);
      ty = panStart.ty + (y - panStart.cy);
      applyPan();
      return;
    }
    const wx = x - tx, wy = y - ty;
    const px = last ? last.x : wx, py = last ? last.y : wy;
    seg(overlayCtx(), revealSrc(), px, py, wx, wy);
    last = {x:wx, y:wy};
  }, {passive:true});

  addEventListener('pointerup', ()=>{ panning=false; document.body.classList.remove('panning'); last=null; });
  addEventListener('pointerout', (e)=>{ if(!e.relatedTarget) last=null; });
</script>
</body>
</html>
